name: Deploy Frontend to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: portalG3
  NODE_VERSION: "20.x"
  WORKING_DIR: frontend

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: Build project
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ env.WORKING_DIR }}/dist
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      # Placeholder: no test suite yet, replace with `npm test` once tests are added.
      - name: Run tests (placeholder)
        working-directory: ${{ env.WORKING_DIR }}
        run: echo "No test suite configured yet — add one and replace this step."

  artifact:
    name: Artifact
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Package artifact
        run: |
          cd dist
          zip -r ../frontend-release.zip .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release
          path: frontend-release.zip
          retention-days: 7

  deploy:
    name: Deploy
    needs: artifact
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-release

      - name: Unzip artifact for deployment
        run: unzip frontend-release.zip -d release

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release
